# Prevent the microphone volume from automatically lowering while Discord is active.
# The binary name may vary depending on the version that is installed (e.g., electron).

access.rules = [
    {
        matches = [
            {
                application.process.binary = "Discord"
            }
        ]
        actions = [
            update-props = {
                default_permissions = "rx"
            }
        ]
    }
]
